<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F6F5F1">
  <title>Wissensassistent – Demo</title>
  <!-- Leeres Favicon: spart eine 404 im Log jeder Anfrage. -->
  <link rel="icon" href="data:,">
  <!-- Keine externen Ressourcen: Systemschriften, keine CDNs (SPEC 13.3.6).
       Reihenfolge laut SPEC 13.3.8: Tokens → Schale → Wissen aufladen. -->
  <link rel="stylesheet" href="design.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="abgeben.css">
  <script type="module" src="app.js"></script>
</head>
<body data-ansicht="laden">
  <!-- Fixiert, nicht schließbar: Jede Ansicht sagt, dass die Daten erfunden sind. -->
  <div class="banner" id="banner" role="note">
    <strong>Demo – fiktive Daten</strong><span id="banner-zusatz"></span>
  </div>

  <!-- Zwei Zonen (SPEC 14.3.4): links Akte oder Fallsuche, rechts Chat bzw.
       „Wissen aufladen“. Blätter („Woher?“, Quelle, Bild) hängt app.js an body. -->
  <div class="app" id="app">
    <header class="kopf" id="kopf" hidden></header>
    <main class="haupt" id="haupt">
      <p class="laden" id="ansicht-laden">Wird geladen …</p>
      <section class="einstieg" id="ansicht-login" aria-label="Anmelden" hidden></section>
      <div class="flaeche" id="ansicht-arbeit" hidden></div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript><p class="laden">Diese Demo braucht JavaScript.</p></noscript>
  <script nomodule>
    document.getElementById("ansicht-laden").textContent =
      "Dieser Browser ist zu alt für die Demo. Bitte einen aktuellen Browser verwenden.";
  </script>
</body>
</html>
